<div class="dashboard-header-bg">
  <div class="container text-center">
    <h1>HI, {{ user?.name | uppercase }}!</h1>
  </div>
</div>

<div class="dashboard-content container">
  
  <div class="main-panel">
    <h3 class="panel-title">You haven't purchased any subscriptions! Get started:</h3>
    
    <div class="cards-grid">
      
      <div class="product-card">
        <div class="card-img-wrapper" style="background: url('https://placehold.co/400x250/f9f9f9/ccc?text=Creative+Kit') center/cover"></div>
        <div class="card-body">
          <h4>Creative Kit</h4>
          <p>Ages 6-10</p>
          <div class="card-actions">
            <button class="btn-add" (click)="addToCart({title: 'Creative Kit', price: 50, id: 1})">Add to Cart</button>
            <button class="btn-wish" (click)="addToWishlist({title: 'Creative Kit', id: 1})">❤</button>
          </div>
        </div>
      </div>

      <div class="product-card">
        <div class="card-img-wrapper" style="background: url('https://placehold.co/400x250/f9f9f9/ccc?text=Build+Box') center/cover"></div>
        <div class="card-body">
          <h4>Build Box</h4>
          <p>Ages 8-13</p>
          <div class="card-actions">
            <button class="btn-add" (click)="addToCart({title: 'Build Box', price: 75, id: 2})">Add to Cart</button>
            <button class="btn-wish" (click)="addToWishlist({title: 'Build Box', id: 2})">❤</button>
          </div>
        </div>
      </div>

      <div class="product-card">
        <div class="card-img-wrapper" style="background: url('https://placehold.co/400x250/f9f9f9/ccc?text=Hack+Pack') center/cover"></div>
        <div class="card-body">
          <h4>Hack Pack</h4>
          <p>Ages 14-101</p>
          <div class="card-actions">
            <button class="btn-add" (click)="addToCart({title: 'Hack Pack', price: 100, id: 3})">Add to Cart</button>
            <button class="btn-wish" (click)="addToWishlist({title: 'Hack Pack', id: 3})">❤</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="wishlist-container">
  <h1>❤️ Memory List (Wishlist)</h1>
  <p>Your favorite building blocks and kits from our memory.</p>

  <div *ngIf="loading" class="loading">⏳ Reading from memory...</div>
  <div *ngIf="error" class="alert error">{{ error }}</div>

  <div *ngIf="wishlistItems.length === 0 && !loading" class="empty-state">
    <p>Your memory is empty! You haven't added anything to your wishlist yet.</p>
    <button class="go-to-store" (click)="router.navigate(['/products'])">🏪 Go to Store</button>
  </div>

  <div class="wishlist-grid" *ngIf="wishlistItems.length > 0">
    <div class="wishlist-card" *ngFor="let item of wishlistItems">
      <div class="product-img">
        <img [src]="item.productId.images[0] || '/assets/placeholder.jpg'" [alt]="item.productId.productName" />
      </div>
      <div class="product-info">
        <h3>{{ item.productId.productName }}</h3>
        <p class="price">${{ item.productId.price }}</p>
        <div class="actions">
          <button class="add-to-cart-btn" (click)="onAddToCart(item.productId)">
            🛒 Add to Cart
          </button>
          <button class="remove-btn" (click)="onRemoveFromWishlist(item.productId._id)">
            ❌ Remove
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

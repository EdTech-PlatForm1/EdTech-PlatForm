<div class="create-order-container" *ngIf="product">
  <div class="order-header">
    <button class="back-btn" (click)="router.navigate(['/products', product._id])">← Back to Product</button>
    <h1>Create Order</h1>
  </div>

  <div class="order-content">
    <div class="product-summary">
      <div class="product-image">
        <img [src]="product.images[0] || '/assets/placeholder.jpg'" [alt]="product.name" />
      </div>
      <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p class="price">${{ product.price }}</p>
      </div>
    </div>

    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="order-form">
      <div *ngIf="error" class="alert error">{{ error }}</div>
      <div *ngIf="message" class="alert success">{{ message }}</div>

      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input
          id="quantity"
          type="number"
          formControlName="quantity"
          min="1"
          placeholder="1"
        />
      </div>

      <div class="form-group">
        <label for="address">Delivery Address</label>
        <textarea
          id="address"
          formControlName="address"
          placeholder="Enter your full delivery address"
          rows="3"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          id="phone"
          type="tel"
          formControlName="phone"
          placeholder="+1 (555) 123-4567"
        />
      </div>

      <div class="form-group">
        <label for="payment">Payment Method</label>
        <select id="payment" formControlName="paymentMethod">
          <option value="card">Credit/Debit Card</option>
          <option value="paypal">PayPal</option>
          <option value="cash">Cash on Delivery</option>
        </select>
      </div>

      <div class="order-total">
        <div class="total-row">
          <span>Subtotal:</span>
          <span>${{ product.price * (orderForm.value.quantity || 1) }}</span>
        </div>
        <div class="total-row">
          <span>Shipping:</span>
          <span>$5.00</span>
        </div>
        <div class="total-row total">
          <span>Total:</span>
          <span>${{ getTotalPrice() + 5 }}</span>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="loading || orderForm.invalid"
        class="confirm-btn"
      >
        {{ loading ? '⏳ Processing...' : '✅ Confirm Order' }}
      </button>
    </form>
  </div>
</div>

<div *ngIf="!product" class="loading">Loading...</div>

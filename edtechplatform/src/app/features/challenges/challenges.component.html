<div class="page-container container">
  <div class="header-section">
    <h2>My Challenges</h2>
    <p>Complete tasks to test your newly acquired skills.</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loader-container">
    <div class="spinner"></div>
    <p>Loading your challenges...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="!isLoading && error" class="alert-error">
    <p>{{ error }}</p>
  </div>

  <!-- Content State -->
  <div *ngIf="!isLoading && !error && challengesData.length > 0" class="courses-container">
    <div class="course-section" *ngFor="let course of challengesData">
      <h3 class="course-title">{{ course.productName }}</h3>
      
      <div class="content-grid">
        <div class="challenge-card" *ngFor="let challengeName of course.challenges; let i = index">
          <div class="challenge-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="award-icon"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
          </div>
          <div class="challenge-info">
            <h4>Challenge {{ i + 1 }}</h4>
            <p>{{ challengeName }}</p>
            <button class="btn-primary start-btn">Start Challenge</button>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && !error && challengesData.length === 0" class="empty-state">
    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
    <h3>No Challenges Available</h3>
    <p>You haven't unlocked any challenges yet. Purchase a course to start!</p>
    <a routerLink="/store" class="btn-primary">Browse Courses</a>
  </div>
</div>

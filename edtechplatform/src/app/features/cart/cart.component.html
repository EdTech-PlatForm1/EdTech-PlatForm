<div class="dashboard-header-bg text-center">
  <h1>SHOPPING CART</h1>
</div>

<div class="dashboard-content">
  <div class="cart-container border-dark-box">
    <table class="cart-table" *ngIf="cartItems.length > 0; else emptyCart">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th style="text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of cartItems; let i = index">
          <td>
            <div class="cart-item-info">
              <img [src]="item.image || 'assets/placeholder.png'" alt="course" class="cart-img">
              <h4>{{ item.title }}</h4>
            </div>
          </td>
          <td class="price-col">{{ item.price | currency }}</td>
          <td style="text-align: right;">
            <button class="btn-remove-dark" (click)="removeItem(i)">Remove</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="cart-summary" *ngIf="cartItems.length > 0">
      <div class="total-row">
        <span>Total:</span>
        <span class="total-price">{{ totalPrice | currency }}</span>
      </div>
      <button class="btn-primary-dark checkout-btn">Proceed to Checkout</button>
    </div>

    <ng-template #emptyCart>
      <div class="empty-state text-center">
        <h4>Your cart is empty</h4>
        <p>Go back to the dashboard to explore courses.</p>
      </div>
    </ng-template>
  </div>
</div>

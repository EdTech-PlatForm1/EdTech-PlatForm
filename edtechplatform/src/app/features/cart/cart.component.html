<div class="container mt-5">
  <h2 class="mb-4">Shopping Cart ({{ cartItems.length }})</h2>

  <div class="cart-table card shadow-sm p-4">
    <table class="table">
      <thead>
        <tr>
          <th>Product Name</th>
          <th>Price</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="cartItems.length === 0">
          <td colspan="3" class="text-center py-4">
            <p class="text-muted">Your cart is empty! Go grab some kits.</p>
            <a routerLink="/dashboard" class="btn btn-primary btn-sm">Back to Dashboard</a>
          </td>
        </tr>

        <tr *ngFor="let item of cartItems; let i = index">
          <td>{{ item.title }}</td>
          <td>{{ item.price | currency }}</td>
          <td class="text-center">
            <button class="btn btn-danger btn-sm" (click)="removeItem(i)">Remove</button>
          </td>
        </tr>
      </tbody>
      
      <tfoot *ngIf="cartItems.length > 0">
        <tr>
          <td class="fw-bold">Total</td>
          <td class="fw-bold text-success">{{ totalPrice | currency }}</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <div class="text-end mt-3" *ngIf="cartItems.length > 0">
      <button class="btn btn-success px-5">Checkout</button>
    </div>
  </div>
</div>
